<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Login</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Google Fonts for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <!-- Your CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">
            <a href="/login.html">
                <img src="./assets/logo.svg" alt="FoodFinder Logo" class="auth-logo">
            </a>
        </div>
        <h2>Welcome to FoodFinder</h2>
        
        <!-- Login Form -->
        <div id="login-section">
            <h3>Login</h3>
            <form id="login-form">
                <label for="login-identifier" class="visually-hidden">Email or Username</label>
                <input type="text" id="login-identifier" placeholder="Email or Username" autocomplete="username" required>
                
                <label for="login-password" class="visually-hidden">Password</label>
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Log In</button>
            </form>
            <p>Don't have an account? <button id="show-register">Register here</button></p>
        </div>

        <!-- Registration Form (Hidden by default) -->
        <div id="register-section" style="display: none;">
            <h3>Create an Account</h3>
            <form id="register-form">
                <label for="register-username" class="visually-hidden">Username</label>
                <input type="text" id="register-username" placeholder="Username" autocomplete="username" required>
                
                <label for="register-email" class="visually-hidden">Email</label>
                <input type="email" id="register-email" placeholder="Email" autocomplete="email" required>
                
                <label for="register-password" class="visually-hidden">Password</label>
                <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" required>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <button id="show-login">Log in here</button></p>
        </div>
        
        <div id="auth-error" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- Modular JS specifically for Auth -->
    <script type="module" src="/JavaScripts/auth.js"></script>
</body>
</html>
