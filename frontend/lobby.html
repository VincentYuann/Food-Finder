<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Lobby</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/dashboard.css"> <!-- Re-use button/input/card styles -->
    <link rel="stylesheet" href="./css/lobby.css">
</head>
<body>
    <div class="lobby-page-container">
        <header class="lobby-header">
            <div class="header-content">
                <div class="lobby-brand-row">
                    <a href="/index.html" class="lobby-logo-link">
                        <img src="./assets/logo.svg" alt="FoodFinder Logo" class="lobby-header-logo">
                    </a>
                    <h1 id="lobby-name">Loading Lobby...</h1>
                </div>
                <a href="/index.html" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back to Dashboard</a>
            </div>
            <div class="lobby-meta" style="align-items: center;">
                <div id="lobby-meta-info" style="display: flex; flex-wrap: wrap; gap: 1.5rem;">
                    <!-- Populated by JS -->
                </div>
                <div id="lobby-action-container" style="margin-left: auto;"></div>
            </div>
        </header>

        <div class="lobby-layout">
            <!-- Main Content: Restaurants & Chat -->
            <main class="lobby-main-content">
                <!-- Replace this section in lobby.html -->
                <section class="lobby-section">
                    <h3>Restaurant Options</h3>
                    
                    <!-- New Toggle Controls -->
                    <div class="section-controls" style="display: flex; gap: 0.5rem;">
                        <button id="show-lobby-search-btn" class="btn btn-secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 6px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Add from Search</button>
                        <button id="show-lobby-saved-btn" class="btn btn-secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 6px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>Add from Saved</button>
                    </div>
                    
                    <!-- Hidden Add Container -->
                    <div id="lobby-add-container" style="display: none; background: #f9f9f9; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
                        
                        <!-- Search UI -->
                        <div id="lobby-search-ui" style="display: none;">
                            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                                <input type="text" id="lobby-search-input" placeholder="Search for food..." style="flex-grow: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px;">
                                <button id="lobby-search-submit" class="btn btn-primary">Search</button>
                            </div>
                            <div id="lobby-search-results" class="restaurants-grid scrollable-list"></div>
                        </div>
                        
                        <!-- Saved UI -->
                        <div id="lobby-saved-ui" style="display: none;">
                            <h4 style="margin-top: 0;">Your Saved Restaurants</h4>
                            <div id="lobby-saved-results" class="restaurants-grid scrollable-list"></div>
                        </div>
                        
                        <button id="close-add-container" class="btn btn-secondary" style="margin-top: 1rem;">Close</button>
                    </div>

                    <div id="lobby-restaurants-list" class="restaurants-grid">
                        <!-- Restaurant cards will be populated by JS -->
                    </div>
                </section>

                <section class="lobby-section">
                    <h3>Lobby Chat <span id="chat-status" class="chat-status chat-status-connecting">Connecting…</span></h3>
                    <div id="chat-container">
                        <div id="chat-messages">
                            <!-- Messages populated by JS -->
                        </div>
                        <form id="chat-form">
                            <input type="text" id="chat-input" placeholder="Send a message..." autocomplete="off">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </form>
                    </div>
                </section>
            </main>

            <!-- Sidebar: Members & Details -->
            <aside class="lobby-sidebar">
                <div class="sidebar-widget">
                    <h4>Members (<span id="member-count">0</span>)</h4>
                    <ul id="members-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </aside>
        </div>
    </div>

    <script type="module" src="/JavaScripts/lobby.js"></script>
</body>
</html>
