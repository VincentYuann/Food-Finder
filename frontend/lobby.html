<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Lobby</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/dashboard.css"> <!-- Re-use button/input/card styles -->
    <link rel="stylesheet" href="./css/lobby.css">
</head>
<body>
    <div class="lobby-page-container">
        <header class="lobby-header">
            <div class="header-content">
                <h1 id="lobby-name">Loading Lobby...</h1>
                <a href="/index.html" class="back-link">← Back to Dashboard</a>
            </div>
            <div id="lobby-meta-info" class="lobby-meta">
                <!-- Populated by JS -->
            </div>
        </header>

        <div class="lobby-layout">
            <!-- Main Content: Restaurants & Chat -->
            <main class="lobby-main-content">
                <section class="lobby-section">
                    <h3>Restaurant Options</h3>
                    <div class="section-controls">
                        <a href="/search.html" class="btn btn-secondary">＋ Add from Search</a>
                    </div>
                    <div id="lobby-restaurants-list" class="restaurants-grid">
                        <!-- Restaurant cards will be populated by JS -->
                    </div>
                </section>

                <section class="lobby-section">
                    <h3>Lobby Chat</h3>
                    <div id="chat-container">
                        <div id="chat-messages">
                            <!-- Messages populated by JS -->
                        </div>
                        <form id="chat-form">
                            <input type="text" id="chat-input" placeholder="Send a message..." autocomplete="off">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </form>
                    </div>
                </section>
            </main>

            <!-- Sidebar: Members & Details -->
            <aside class="lobby-sidebar">
                <div class="sidebar-widget">
                    <h4>Members (<span id="member-count">0</span>)</h4>
                    <ul id="members-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </aside>
        </div>
    </div>

    <script src="/JavaScripts/lobby.js"></script>
</body>
</html>
