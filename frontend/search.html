<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Search</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/dashboard.css"> <!-- Re-use button/input styles -->
    <link rel="stylesheet" href="./css/search.css">
</head>
<body>
    <div class="search-page-container">
        <header class="search-header">
            <h1>Find Your Next Meal</h1>
            <a href="/index.html" class="back-link">← Back to Dashboard</a>
        </header>

        <div class="search-controls">
            <div class="control-group">
                <label for="search-input">What are you craving?</label>
                <input type="text" id="search-input" placeholder="e.g., Pizza, Sushi, Tacos...">
            </div>
            <div class="control-group location-controls">
                <button id="use-location-btn" class="btn btn-secondary">📍 Use My Location</button>
                <div class="radius-group">
                    <label for="radius-input">Radius (meters)</label>
                    <input type="number" id="radius-input" value="1500" step="500" min="500">
                </div>
            </div>
            <button id="search-btn" class="btn btn-primary">Search Restaurants</button>
        </div>

        <div id="status-message"></div>
        <div id="loading"><div class="spinner"></div></div>

        <main id="results-container" class="results-grid"></main>
    </div>
    <script type="module" src="/JavaScripts/search.js"></script>
</body>
</html>
