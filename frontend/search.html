<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Search</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/dashboard.css"> <!-- Re-use button/input styles -->
    <link rel="stylesheet" href="./css/search.css">
</head>
<body>
    <div class="search-page-container">
        <header class="search-header">
            <div class="search-brand">
                <a href="/index.html">
                    <img src="./assets/logo.svg" alt="FoodFinder Logo" class="header-logo">
                </a>
            </div>
            <h1>Find Your Next Meal</h1>
            <a href="/index.html" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back to Dashboard</a>
        </header>

        <div class="search-controls">
            <div class="control-group">
                <label for="cuisine-input">Cuisine / Type</label>
                <select id="cuisine-input">
                    <option value="">Any Cuisine</option>
                    <option value="American">American</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Italian">Italian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Thai">Thai</option>
                    <option value="Indian">Indian</option>
                    <option value="French">French</option>
                    <option value="Korean">Korean</option>
                    <option value="Mediterranean">Mediterranean</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Cafe">Cafe / Coffee</option>
                    <option value="Fast Food">Fast Food</option>
                    <option value="Bakery">Bakery</option>
                </select>
            </div>
            <div class="control-group">
                <label for="search-input">Restaurant Name</label>
                <input type="text" id="search-input" placeholder="e.g., Joe's Pizza (Optional)">
            </div>
            <div class="control-group location-controls">
                <button id="use-location-btn" class="btn btn-secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 6px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>Use My Location</button>
                <div class="radius-group">
                    <label for="radius-input">Radius (miles)</label>
                    <input type="number" id="radius-input" value="5" step="1" min="1" max="30">
                </div>
            </div>
            <button id="search-btn" class="btn btn-primary">Search Restaurants</button>
        </div>

        <div id="status-message"></div>
        <div id="loading"><div class="spinner"></div></div>

        <main id="results-container" class="results-grid"></main>
    </div>
    <script type="module" src="/JavaScripts/search.js"></script>
</body>
</html>
